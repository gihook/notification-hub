services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq   # fixed node name so queued messages persist across container recreation
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"   # management UI (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12

  hub:
    build: ./hub
    env_file: .env
    environment:
      ROUTING_CONFIG: /config/routing.json
    volumes:
      - ./config:/config:ro
    ports:
      - "${HUB_PORT:-8000}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  example-worker:
    build: ./workers/example
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
