services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq   # fixed node name so queued messages persist across container recreation
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"   # management UI (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12

  hub:
    build: ./hub
    env_file: .env
    environment:
      ROUTING_CONFIG: /config/routing.json
    volumes:
      - ./config:/config:ro
    ports:
      - "${HUB_PORT:-8000}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  example-worker:
    build: ./workers/example
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  mailer-worker:
    build: ./workers/mailer
    env_file:
      - .env
      - workers/mailer/.env
    environment:
      GOOGLE_CREDENTIALS_PATH: /secrets/credentials.json
    volumes:
      # Google service account key (host path set via GOOGLE_CREDENTIALS_FILE in .env)
      - ${GOOGLE_CREDENTIALS_FILE:-./secrets/google-credentials.json}:/secrets/credentials.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI with all caught emails
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  rabbitmq-data:
